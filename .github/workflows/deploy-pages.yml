name: Deploy to GitHub Pages

# El sitio se publica desde la rama gh-pages (Pages en modo "deploy from branch").
# Este workflow mantiene gh-pages sincronizada con la rama de desarrollo.
on:
  push:
    branches:
      - claude/actuarial-learning-platform-x52tn8
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync gh-pages branch
        run: git push --force origin HEAD:gh-pages
